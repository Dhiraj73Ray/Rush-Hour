<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rush Hour - Fullstack Client</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🚗 Rush Hour Engine</h1>
    
    <div id="board"></div>

    <div class="controls">
      <input type="text" id="carInput" placeholder="Car (A)" maxlength="1" style="max-width: 80px;">
      <input type="number" id="stepsInput" placeholder="Steps (+1 / -1)">
      <button id="moveBtn">Move</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div id="status"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
